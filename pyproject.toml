[project]
name = "sentinelai"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "torch",
    "fastapi[standard]",
    "uvicorn[standard]",
    "gunicorn",
    "jinja2",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "pytest",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
