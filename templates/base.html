<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SentinelAI — Content Intelligence</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='/favicon.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/styles.css') }}?v=5">
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <nav class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#58a6ff"/>
              <stop offset="100%" stop-color="#a371f7"/>
            </linearGradient>
          </defs>
          <path d="M16 2.5L28 7.5V16c0 6.5-5.5 11.5-12 13.5C9.5 27.5 4 22.5 4 16V7.5Z"
                fill="rgba(13,17,23,0.9)" stroke="url(#lg)" stroke-width="1.5" stroke-linejoin="round"/>
          <line x1="11" y1="12" x2="21" y2="12" stroke="url(#lg)" stroke-width="0.9" opacity="0.55"/>
          <line x1="11" y1="12" x2="16" y2="21" stroke="url(#lg)" stroke-width="0.9" opacity="0.55"/>
          <line x1="21" y1="12" x2="16" y2="21" stroke="url(#lg)" stroke-width="0.9" opacity="0.55"/>
          <line x1="16" y1="12" x2="16" y2="21" stroke="url(#lg)" stroke-width="0.9" opacity="0.35"/>
          <circle cx="11" cy="12" r="2"   fill="url(#lg)"/>
          <circle cx="21" cy="12" r="2"   fill="url(#lg)"/>
          <circle cx="16" cy="21" r="2"   fill="url(#lg)"/>
          <circle cx="16" cy="12" r="1.5" fill="url(#lg)" opacity="0.6"/>
        </svg>
        <span>SentinelAI</span>
      </div>
      <span class="topbar-badge">Content Intelligence</span>
    </div>
  </nav>

  <main class="main">
    <div class="page-header">
      <h1>Content Analysis</h1>
      <p id="ai-typing"></p>
    </div>
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', path='/js/script.js') }}"></script>
</body>
</html>
